name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name CountdownTimer --icon icon.ico --add-data "icon.png;." countdown_timer.py

      - uses: actions/upload-artifact@v4
        with:
          name: CountdownTimer-windows
          path: dist/CountdownTimer.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/CountdownTimer.exe --title "Countdown Timer ${{ github.ref_name }}" --generate-notes
